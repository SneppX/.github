name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Security issues: do NOT use this form.** Report them privately —
        see [SECURITY.md](https://github.com/SneppX/.github/blob/main/SECURITY.md).

  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which SneppX repository is affected?
      placeholder: sneppx-alg
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest possible steps or script that triggers the bug.
      placeholder: |
        1. Install `sneppx-alg` from `main`
        2. Run `python -m pytest tests/python/test_tensor.py`
        3. See `AssertionError` on ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python, package version, hardware.
      placeholder: |
        - OS: Windows 11 x64
        - Python: 3.11.9
        - sneppx-alg: main @ abc1234
        - Hardware: CPU only
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing open **and** closed issues and did not find this
          required: true
        - label: This is not a security vulnerability (those go via SECURITY.md)
          required: true
