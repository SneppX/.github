# Org default: close stale issues and PRs.
#
# Inherited by repositories in this org that do NOT define their own
# .github/workflows/ folder. Runs daily. Conservative thresholds so genuine
# long-running work is not closed prematurely.

name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days unless there is
            new activity or a maintainer removes the `stale` label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed in 14 days unless
            there is new activity or a maintainer removes the `stale` label.
          close-issue-message: >
            Closing this issue as stale. Feel free to reopen if it is still
            relevant.
          close-pr-message: >
            Closing this pull request as stale. Feel free to reopen if it is
            still relevant.
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,good first issue,help wanted,security,documentation"
          exempt-pr-labels: "pinned,security,do-not-merge"
          exempt-all-assignees: true
