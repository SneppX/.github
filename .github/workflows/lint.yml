# Org default: Python lint (ruff).
#
# NOTE: Ordinary workflows in this repository are NOT automatically inherited
# by other repositories. Only community-health files are inherited.

name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Run ruff
        run: ruff check --output-format=github --exit-zero .
