# Blocking checks for the .github repository itself.
# Runs the repository's pytest suite (ruff is covered by the advisory lint.yml).

name: ci-blocking

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pytest
      - run: pytest -q
