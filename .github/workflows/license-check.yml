# Org default: license check.
#
# NOTE: Ordinary workflows in this repository are NOT automatically inherited
# by other repositories. Only community-health files are inherited. Repositories
# that want this check must either define their own workflow or call a reusable
# workflow explicitly.

name: license-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: false

      - name: Check for a LICENSE file
        run: |
          found=""
          for f in LICENSE LICENSE.md LICENSE.txt COPYING COPYING.md; do
            if [ -f "$f" ]; then found="$found $f"; fi
          done
          if [ -z "$found" ]; then
            echo "::error::No LICENSE file found at the repository root."
            exit 1
          fi
          echo "Found:$found"
