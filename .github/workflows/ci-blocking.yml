# Blocking checks for the .github repository itself.
# Runs ruff (without --exit-zero) and the repository's pytest suite.

name: ci-blocking

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ruff pytest
      - run: ruff check .
      - run: pytest -q
