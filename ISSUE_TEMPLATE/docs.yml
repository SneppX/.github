name: Documentation improvement
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs.

  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which SneppX repository is affected?
      placeholder: sneppx-alg
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where is the issue?
      description: File path or URL to the documentation.
      placeholder: docs/QUICKSTART.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the gap, error, or confusion.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: How you would improve it (optional).

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing open and closed issues
          required: true
